# Scratch workflow of the probe branch only (never merged). It takes the disk image from the downloads
# folder, installs it on Mac runners the way a user does and walks through the app by script:
# fresh, over a 1.0 installation with data, and with its Intel half through Rosetta.
# Each job keeps what it saw (screenshots, logs) as an artifact of the run.
name: Probe

on:
  push:
    branches: ['probe/**']

permissions:
  contents: write

concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  image:
    name: The disk image
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build a fresh one, inspect the published one
        run: bash tools/probe/dmg.sh
      - name: Publish what was written
        if: always()
        run: rm -f "$RUNNER_TEMP"/out/*.dmg; bash tools/probe/publish.sh dmg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-report
          path: ${{ runner.temp }}/out

  tour:
    name: Walk through the installed app
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Run the tour
        run: bash tools/probe/tour.sh
      - name: Publish what was written
        if: always()
        run: bash tools/probe/publish.sh tour
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tour-screens
          path: ${{ runner.temp }}/out

  upgrade:
    name: Update a 1.0 installation that has data
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Get the 1.0 disk image from main
        run: |
          git fetch -q --depth 1 origin main
          mkdir -p "$RUNNER_TEMP/old"
          git show FETCH_HEAD:downloads/JobRadar-1.0.dmg > "$RUNNER_TEMP/old/JobRadar-1.0.dmg"
          ls -l "$RUNNER_TEMP/old"
      - name: Run the upgrade walk
        run: bash tools/probe/upgrade.sh
      - name: Publish what was written
        if: always()
        run: bash tools/probe/publish.sh upgrade
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-screens
          path: ${{ runner.temp }}/out

  intel:
    name: The Intel half of the app, through Rosetta
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Run the Intel walk
        run: bash tools/probe/intel.sh
      - name: Publish what was written
        if: always()
        run: bash tools/probe/publish.sh intel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intel-screens
          path: ${{ runner.temp }}/out
