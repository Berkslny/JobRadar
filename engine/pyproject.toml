[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobradar"
version = "1.1.0"
description = "Local-first job search assistant: multi-source discovery, evidence-based scoring with your own AI model, truthful CV tailoring and human-approved applications."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Berk Selenay" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "jinja2>=3.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "beautifulsoup4>=4.12",
  "python-multipart>=0.0.9",
  "pypdf>=4.0",
]

[project.optional-dependencies]
jobspy = ["python-jobspy>=1.4"]
pdf = ["rendercv[full]>=2.0"]
match = ["fastembed>=0.9"]
dev = ["pytest>=8"]
all = ["python-jobspy>=1.4", "rendercv[full]>=2.0", "fastembed>=0.9", "pytest>=8"]

[project.scripts]
jobradar = "jobradar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobradar = ["web/templates/*.html", "web/static/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
