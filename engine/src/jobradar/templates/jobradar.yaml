# JobRadar configuration.
#
# The JobRadar app edits its settings in data/settings.json, which overrides this file, so you normally never
# touch it. Edit it by hand when you run JobRadar from the command line or on a server.
# A complete worked example (three tracks for an engineer in Germany) is in the package: templates/demo.yaml

language: ""                  # interface language of texts the API returns: en | tr ("" = JOBRADAR_LANG, else tr)
data_dir: data
profile: data/profile.yaml
dashboard_port: 8787
follow_up_days: 10            # days after applying before a "follow up" reminder

# What you are looking for. Each track is one direction with its own keywords.
tracks: []
#  - id: backend
#    name: Backend engineering
#    priority: 1
#    nationwide: false         # true: search the whole country instead of the locations below
#    north_star: >-
#      Backend engineering roles (Python, Go) at product companies; mid level; Berlin or remote.
#    title_keywords: [Backend, Python, Golang, Software Engineer, Softwareentwickl]   # words in matching TITLES
#    domain_keywords: [Django, FastAPI, PostgreSQL, Kubernetes, AWS]                   # words in matching DESCRIPTIONS
#    search_terms: [Backend Engineer, Python Developer, Softwareentwickler Python]     # typed into the job boards

search:
  country: ""                 # English country name as job boards use it: Germany, USA, UK, Turkey, Netherlands ...
  locations: []               # e.g. [{city: Berlin, radius_km: 50}]
  preferred_cities: []
  include_remote: true
  max_age_days: 120
  employment_types: [fulltime]   # fulltime, parttime, werkstudent, internship, thesis, trainee, apprenticeship, freelance, contract

sources:
  jobspy:                     # LinkedIn, Indeed and others through python-jobspy (pip install 'jobradar[jobspy]')
    enabled: true
    sites: [linkedin, indeed]
    results_wanted: 25
    hours_old: 72
    fetch_description: false
    pause_seconds: 5
    max_queries: 12
    linkedin_cooldown_seconds: 60
    linkedin_max_blocks: 2
    proxies: []
  arbeitsagentur:             # official API of the German Federal Employment Agency (Germany only)
    enabled: false
    angebotsart: [1, 34]
    days: 30
    size: 50
    max_pages: 3
    include_zeitarbeit: false
    include_private_agencies: false
  freehire:                   # freehire.me: company career systems, XING and EURES (free for personal use)
    enabled: false
    countries: []             # ISO codes, e.g. [DE]
    limit: 50
    posted_within_days: 30
    max_queries: 12
    max_pages: 3
  companies: []               # career pages to read directly, e.g. {name: Acme, ats: greenhouse, slug: acme}
                              # ats: greenhouse, lever, lever_eu, ashby, personio, smartrecruiters, recruitee, workday, softgarden
  inbox_dir: inbox
  enrich_per_run: 40

filters:
  title_exclude: []           # postings with these words in the title are dropped
  company_blacklist: []
  exclude_senior: true
  exclude_agencies: false
  require_track_match: true
  allow_unspecified_remote: true
  german_gap_policy: warn     # warn | exclude (German level required far above yours)
  clearance_policy: warn      # warn | exclude | ignore (security clearance and citizenship requirements)

scoring:
  prescore_min: 40            # minimum keyword score (0-100) before a posting goes to the AI model
  llm_max_per_run: 20         # AI evaluations per scan
  apply_threshold: 4.0
  max_description_chars: 12000

# Smart matching: an embedding model compares every posting with your tracks and your profile by meaning.
# Evaluations then go first to the postings that keywords AND meaning agree on, and a posting the keyword
# rules would miss can be promoted (rules you set yourself, such as title words or seniority, always hold).
# The built-in model and Ollama run on this computer: nothing about you or the postings is sent anywhere.
matching:
  enabled: false
  provider: fastembed         # fastembed (built in: pip install 'jobradar[match]') | ollama | openai (compatible)
  model: ""                   # "" = sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 (220 MB, once);
                              # ollama: "" = bge-m3 (ollama pull bge-m3); openai-compatible: name it
  base_url: ""                # ollama / openai: "" = the address under llm
  promote: true               # let a strong semantic match pass the keyword rules
  promote_max_per_run: 5      # at most this many per scan
  promote_percentile: 50      # needed: a semantic score above this share of the keyword matches
  max_seconds_per_run: 180    # time a scan may spend on embedding; the rest waits for the next scan

llm:
  provider: none              # claude_cli | anthropic | openai | ollama | auto | none
  allow_paid_api: false       # pay-per-token APIs (anthropic, hosted openai-compatible) stay off unless true
  output_language: auto       # language of evaluation texts; auto = interface language
  eval_tier: fast
  tailor_tier: smart
  anthropic: {fast_model: claude-haiku-5-5, smart_model: claude-sonnet-5-5}
  claude_cli: {path: claude, fast_model: haiku, smart_model: sonnet, subscription_only: false}
  ollama: {base_url: "http://localhost:11434", fast_model: "", smart_model: "", num_ctx: 16384}
  openai: {base_url: "https://api.openai.com/v1", fast_model: "", smart_model: ""}

notify:
  dashboard_url: http://127.0.0.1:8787
  telegram: {enabled: false, min_score: 4.0, min_prescore_without_llm: 70, daily_digest: true, health_alerts: true}
  email:                      # active when SMTP_USER and SMTP_PASSWORD are set (.env or the app's e-mail settings)
    enabled: true
    host: smtp.gmail.com
    port: 587
    min_score: 3.5
    max_jobs: 12
    instant: true
    instant_min_score: 4.0
    instant_max_jobs: 5

mail_sync:                    # read replies from companies (IMAP, read only) and propose status changes
  enabled: true
  host: imap.gmail.com
  port: 993
  folder: INBOX
  days: 21
  max_messages: 150

quick: {sources: [companies], max_evaluations: 5, max_pages: 10}
server: {public_url: "", session_days: 30, backups_keep: 14}

tailor:
  pdf_engine: auto            # auto | chrome | rendercv | helper | none
  chrome_path: ""
  default_language: ""        # CV and letter language when the posting's language is unknown ("" = by country)
  sender_city: ""
  review: true
  cv_max_pages: 2
  letter_max_pages: 1
